<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>Вход</h1>

    <p class="error" th:if="${param.error}">Неверный логин или пароль</p>
    <p class="ok" th:if="${param.registered}">Регистрация успешна, войдите</p>
    <p class="ok" th:if="${param.logout}">Вы вышли</p>

    <form method="post" th:action="@{/login}">
        <label>Логин</label>
        <input type="text" name="username" required>

        <label>Пароль</label>
        <input type="password" name="password" required>

        <button type="submit" style="width:100%; margin-top:24px;">Войти</button>
    </form>

    <p>Нет аккаунта? <a th:href="@{/register}">Регистрация</a></p>
</div>
</body>
</html>
